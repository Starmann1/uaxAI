industry_name: "pharma_materials"
display_name: "Pharmaceutical Materials Master"
terminology:
  - "Active Pharmaceutical Ingredient (API)"
  - "Finished Goods Stock SKU"
  - "Raw Materials Intake"
entity_list:
  - "RM-001"
  - "PM-001"
  - "FG-001"
metric: "Materials"
dataset_reference: "data/pharma/materials.csv"
record_schema: "pharma_material"
supported_capabilities:
  - "count"
  - "type"
allowed_filters:
  - "material_code"
  - "material_type"
  - "is_active"
metrics:
  - metric_id: "total_materials"
    operation: "count"
    display_name: "Total Materials Count"
  - metric_id: "raw_materials_count"
    operation: "count"
    filter_field: "material_type"
    filter_value: "RAW_MATERIAL"
    display_name: "Raw Materials Count"
  - metric_id: "finished_goods_count"
    operation: "count"
    filter_field: "material_type"
    filter_value: "FINISHED_GOOD"
    display_name: "Finished Goods Count"
