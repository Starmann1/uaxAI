industry_name: "pharma"
display_name: "Pharmaceutical Manufacturing"
terminology:
  - "Batch Yield Percentage"
  - "Critical Process Parameter (CPP)"
  - "Critical Quality Attribute (CQA)"
  - "Autoclave Sterilization Time"
entity_list:
  - "Bioreactor Alpha"
  - "Centrifuge Beta"
  - "Autoclave Gamma"
  - "Formulation Unit"
  - "MFG-01"
  - "WH-MAIN"
  - "QC-HOLD"
  - "REJECTED"
metric: "Batch Yield Percentage"
dataset_reference: "data/pharma/batches.csv"
record_schema: "pharmaceutical_batch"
supported_capabilities:
  - "yield"
  - "total"
  - "count"
  - "status"
allowed_filters:
  - "batch_id"
  - "reactor_id"
  - "quality_status"
metrics:
  - metric_id: "batch_yield_sum"
    operation: "sum"
    target_field: "batch_yield_pct"
    display_name: "Sum of Batch Yield Percentages"
  - metric_id: "average_batch_yield"
    operation: "average"
    target_field: "batch_yield_pct"
    display_name: "Average Batch Yield"
  - metric_id: "failed_batch_count"
    operation: "count"
    filter_field: "quality_status"
    filter_value: "Fail"
    display_name: "Failed Batch Count"
  - metric_id: "batch_count"
    operation: "count"
    display_name: "Batch Count"
