industry_name: "pharma_deviations"
display_name: "Pharmaceutical Deviations"
terminology:
  - "Manufacturing Deviation"
  - "Deviation Severity Status"
  - "Critical Deviation Incident"
entity_list:
  - "BAT-004"
  - "BAT-008"
  - "PB-1004"
metric: "Deviation Incidents"
dataset_reference: "data/pharma/deviations.csv"
record_schema: "pharma_deviation"
supported_capabilities:
  - "count"
  - "status"
  - "severity"
allowed_filters:
  - "batch_number"
  - "criticality"
  - "status"
metrics:
  - metric_id: "total_deviations"
    operation: "count"
    display_name: "Total Deviations Count"
  - metric_id: "major_deviations"
    operation: "count"
    filter_field: "criticality"
    filter_value: "MAJOR"
    display_name: "Major Deviations Count"
  - metric_id: "critical_deviations"
    operation: "count"
    filter_field: "criticality"
    filter_value: "CRITICAL"
    display_name: "Critical Deviations Count"
